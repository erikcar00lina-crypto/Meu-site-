<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner Lendário</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: white;
  text-align: center;
  font-family: Arial;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 80px;
  width: 50px;
  height: 60px;
  border-radius: 10px;
  transition: left 0.2s;
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  width: 50px;
  height: 50px;
  background: red;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}

/* CONTROLES */
#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
}

button {
  padding: 12px;
  margin: 6px;
}

/* LOJA */
#loja {
  display:none;
  position:fixed;
  top:10%;
  width:100%;
  background:black;
  padding:10px;
}

/* GAME OVER */
#gameover {
  display:none;
  position:fixed;
  top:30%;
  width:100%;
}
</style>
</head>

<body>

<div id="hud">
❤️ <span id="vida">3</span> |
⏳ <span id="cd">Pronto</span> |
🏆 <span id="score">0</span>
<br>
<button onclick="abrirLoja()">🛒 Loja</button>
</div>

<div id="player"></div>

<div id="controls">
<button onclick="moveLeft()">⬅️</button>
<button onclick="dominio()" id="btnDom">⚡</button>
<button onclick="moveRight()">➡️</button>
</div>

<div id="loja">
<h2>🛒 Loja</h2>

<p>🧍 Skin Azul - 50</p>
<button onclick="comprarSkin('blue',50)">Comprar</button>

<p>🔥 Skin Vermelha - 100</p>
<button onclick="comprarSkin('red',100)">Comprar</button>

<p>⚡ Domínio Forte - 150</p>
<button onclick="comprarPoder(150)">Comprar</button>

<br>
<button onclick="fecharLoja()">Fechar</button>
</div>

<div id="gameover">
<h1>💀 Game Over</h1>
<p>Pontos: <span id="finalScore"></span></p>
<p>Recorde: <span id="record"></span></p>
<button onclick="location.reload()">Reiniciar</button>
</div>

<script>
let player = document.getElementById("player");

let vida = 3;
let score = 0;
let cd = false;

/* salvar */
let skin = localStorage.getItem("skin") || "purple";
let poderForte = localStorage.getItem("poder") === "true";

/* aplicar skin */
function aplicarSkin(){
  player.style.background = skin;
}
aplicarSkin();

/* pistas */
let lanes = [window.innerWidth*0.2, window.innerWidth*0.5, window.innerWidth*0.8];
let laneIndex = 1;

function updatePlayer(){
  player.style.left = lanes[laneIndex] + "px";
}
updatePlayer();

function moveLeft(){ if(laneIndex>0) laneIndex--; updatePlayer(); }
function moveRight(){ if(laneIndex<2) laneIndex++; updatePlayer(); }

/* score */
setInterval(()=>{
  score++;
  document.getElementById("score").innerText = score;
},1000);

/* obstáculos */
setInterval(()=>{
  let o = document.createElement("div");
  o.className = "obstaculo";

  let lane = Math.floor(Math.random()*3);
  o.dataset.lane = lane;
  o.style.left = lanes[lane] + "px";
  o.style.top = "0px";

  document.body.appendChild(o);

  let fall = setInterval(()=>{
    let top = parseInt(o.style.top);
    o.style.top = (top + 7) + "px";

    if(top > window.innerHeight - 140 && lane === laneIndex){
      vida--;
      document.getElementById("vida").innerText = vida;
      o.remove();
      clearInterval(fall);

      if(vida <= 0) gameOver();
    }

    if(top > window.innerHeight){
      o.remove();
      clearInterval(fall);
    }

  },25);

},1000);

/* domínio */
function dominio(){
  if(cd) return;

  cd = true;
  document.getElementById("btnDom").disabled = true;

  document.body.style.background = "purple";

  document.querySelectorAll(".obstaculo").forEach(o=>{
    if(poderForte) o.style.background="cyan";
    o.remove();
  });

  setTimeout(()=>document.body.style.background="black",300);

  let tempo = 30;
  let cdText = document.getElementById("cd");

  let timer = setInterval(()=>{
    tempo--;
    cdText.innerText = tempo+"s";

    if(tempo<=0){
      clearInterval(timer);
      cd=false;
      cdText.innerText="Pronto";
      document.getElementById("btnDom").disabled=false;
    }
  },1000);
}

/* loja */
function abrirLoja(){ document.getElementById("loja").style.display="block"; }
function fecharLoja(){ document.getElementById("loja").style.display="none"; }

function comprarSkin(tipo,preco){
  if(score<preco){ alert("Sem pontos"); return; }
  score-=preco;
  skin=tipo;
  localStorage.setItem("skin",tipo);
  aplicarSkin();
}

function comprarPoder(preco){
  if(score<preco){ alert("Sem pontos"); return; }
  score-=preco;
  poderForte=true;
  localStorage.setItem("poder",true);
}

/* game over */
function gameOver(){
  document.getElementById("gameover").style.display="block";
  document.getElementById("finalScore").innerText=score;

  let record = localStorage.getItem("record") || 0;
  if(score>record){
    localStorage.setItem("record",score);
    record=score;
  }
  document.getElementById("record").innerText=record;
}
</script>

</body>
</html>
