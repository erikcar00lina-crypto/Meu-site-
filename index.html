<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner Lendário</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: white;
  text-align: center;
  font-family: Arial;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 80px;
  width: 50px;
  height: 60px;
  background: purple;
  border-radius: 10px;
  transition: left 0.2s;
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  width: 50px;
  height: 50px;
  background: red;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}

/* BOTÕES */
#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
}

button {
  padding: 15px;
  margin: 10px;
  font-size: 20px;
}

/* GAME OVER */
#gameover {
  position: fixed;
  top: 30%;
  width: 100%;
  display: none;
}
</style>
</head>

<body>

<div id="hud">
❤️ Vida: <span id="vida">3</span> |
⏳ Domínio: <span id="cd">Pronto</span> |
🏆 Pontos: <span id="score">0</span>
</div>

<div id="player"></div>

<div id="controls">
  <button onclick="moveLeft()">⬅️</button>
  <button onclick="dominio()" id="btnDom">⚡</button>
  <button onclick="moveRight()">➡️</button>
</div>

<div id="gameover">
  <h1>💀 Game Over</h1>
  <p>Pontos: <span id="finalScore"></span></p>
  <p>Recorde: <span id="record"></span></p>
  <button onclick="location.reload()">Jogar novamente</button>
</div>

<script>
let player = document.getElementById("player");
let vida = 3;
let score = 0;

/* pistas */
let lanes = [window.innerWidth*0.2, window.innerWidth*0.5, window.innerWidth*0.8];
let laneIndex = 1;

function updatePlayer(){
  player.style.left = lanes[laneIndex] + "px";
}
updatePlayer();

function moveLeft(){ if(laneIndex>0) laneIndex--; updatePlayer(); }
function moveRight(){ if(laneIndex<2) laneIndex++; updatePlayer(); }

/* SCORE */
setInterval(()=>{
  score++;
  document.getElementById("score").innerText = score;
}, 1000);

/* OBSTÁCULOS (mais rápido) */
setInterval(()=>{
  let o = document.createElement("div");
  o.className = "obstaculo";

  let lane = Math.floor(Math.random()*3);
  o.dataset.lane = lane;
  o.style.left = lanes[lane] + "px";
  o.style.top = "0px";

  document.body.appendChild(o);

  let fall = setInterval(()=>{
    let top = parseInt(o.style.top);
    o.style.top = (top + 7) + "px"; // velocidade aumentada

    if(top > window.innerHeight - 140 && lane === laneIndex){
      vida--;
      document.getElementById("vida").innerText = vida;
      o.remove();
      clearInterval(fall);

      if(vida <= 0){
        gameOver();
      }
    }

    if(top > window.innerHeight){
      o.remove();
      clearInterval(fall);
    }

  }, 25);

}, 1000);

/* DOMÍNIO COM COOLDOWN */
let cd = false;

function dominio(){
  if(cd) return;

  cd = true;
  document.getElementById("btnDom").disabled = true;

  document.body.style.background = "purple";
  document.querySelectorAll(".obstaculo").forEach(o=>o.remove());

  setTimeout(()=>{
    document.body.style.background = "black";
  },300);

  let tempo = 30;
  let cdText = document.getElementById("cd");

  let timer = setInterval(()=>{
    tempo--;
    cdText.innerText = tempo + "s";

    if(tempo <= 0){
      clearInterval(timer);
      cd = false;
      cdText.innerText = "Pronto";
      document.getElementById("btnDom").disabled = false;
    }
  },1000);
}

/* GAME OVER + RECORD */
function gameOver(){
  document.getElementById("gameover").style.display = "block";
  document.getElementById("finalScore").innerText = score;

  let record = localStorage.getItem("record") || 0;

  if(score > record){
    localStorage.setItem("record", score);
    record = score;
  }

  document.getElementById("record").innerText = record;
}
</script>

</body>
</html>
