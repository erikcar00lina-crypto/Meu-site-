<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Reino do Autor Absoluto</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin-top: 20%;
  font-size: 3em;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px purple; }
  to { text-shadow: 0 0 30px cyan; }
}

button {
  padding: 12px 25px;
  background: purple;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: cyan;
  color: black;
}

/* PORTAL */
.portal {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: radial-gradient(circle, black 40%, purple, cyan);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: all 1s ease;
}

/* TREMER TELA */
@keyframes shake {
  0% { transform: translate(0px); }
  25% { transform: translate(5px, -5px); }
  50% { transform: translate(-5px, 5px); }
  75% { transform: translate(5px, 5px); }
  100% { transform: translate(0px); }
}
</style>
</head>

<body>

<h1>絶対的作者の王国</h1>
<p>Você entrou no domínio do autor...</p>
<button onclick="ativar()">Reescrever Realidade</button>

<div class="portal" id="portal"></div>

<script>
function ativar() {
  document.body.style.animation = "shake 0.3s infinite";

  setTimeout(() => {
    document.body.style.animation = "none";

    let portal = document.getElementById("portal");
    portal.style.width = "2000px";
    portal.style.height = "2000px";

    document.body.innerHTML = `
      <h1 style="margin-top:40%; font-size:2em;">
      VOCÊ FOI APAGADO
      </h1>
    `;
    document.body.style.background = "black";

  }, 1500);
}
</script>

</body>
</html>
