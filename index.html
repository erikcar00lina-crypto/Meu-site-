<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner 3D Melhorado</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 60px;
  width: 50px;
  height: 60px;
  background: purple;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 10px;
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  width: 40px;
  height: 40px;
  background: red;
}
</style>
</head>

<body>

<div id="player"></div>

<script>
let player = document.getElementById("player");

let lanes = [-120, 0, 120];
let lane = 1;

/* mover (toque na tela) */
document.addEventListener("click", e => {
  if(e.clientX < window.innerWidth/2) lane--;
  else lane++;

  if(lane < 0) lane = 0;
  if(lane > 2) lane = 2;

  player.style.left = (window.innerWidth/2 + lanes[lane]) + "px";
});

/* criar obstáculos */
setInterval(()=>{
  let o = document.createElement("div");
  o.className = "obstaculo";

  let l = Math.floor(Math.random()*3);
  o.dataset.lane = l;

  let z = 0;
  document.body.appendChild(o);

  let move = setInterval(()=>{
    z += 2; // MAIS LENTO

    let scale = z/120;

    o.style.left = (window.innerWidth/2 + lanes[l]) + "px";
    o.style.top = (z*3) + "px";
    o.style.transform = "scale(" + scale + ")";

    /* colisão mais justa */
    if(z > 90 && z < 110 && l === lane){
      alert("💀 Game Over");
      location.reload();
    }

    if(z > 150){
      o.remove();
      clearInterval(move);
    }

  }, 30);

}, 1200); // MAIS TEMPO ENTRE OBSTÁCULOS
</script>

</body>
</html>
