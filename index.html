<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Reino do Autor Absoluto</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin-top: 15%;
  font-size: 2.5em;
}

button {
  margin: 10px;
  padding: 12px 20px;
  background: purple;
  border: none;
  color: white;
  cursor: pointer;
}

button:hover {
  background: cyan;
  color: black;
}
</style>
</head>

<body>

<h1>絶対的作者の王国</h1>
<p>Você despertou dentro do domínio...</p>

<button onclick="inicio()">Entrar no Vazio</button>

<audio id="somClique">
  <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3">
</audio>

<script>
function som() {
  document.getElementById("somClique").play();
}

function inicio() {
  som();
  document.body.innerHTML = `
    <h1>O Vazio te observa...</h1>
    <p>Uma voz pergunta: "Você quer poder... ou liberdade?"</p>
    <button onclick="poder()">Buscar Poder</button>
    <button onclick="fugir()">Fugir</button>
  `;
}

function poder() {
  som();
  document.body.innerHTML = `
    <h1>Você aceitou o poder...</h1>
    <p>Mas algo está errado...</p>
    <button onclick="dominar()">Controlar o poder</button>
    <button onclick="perder()">Perder o controle</button>
  `;
}

function fugir() {
  som();
  document.body.innerHTML = `
    <h1>Você tenta fugir...</h1>
    <p>Mas o vazio não deixa...</p>
    <button onclick="morrer()">Ser consumido</button>
  `;
}

function dominar() {
  som();
  document.body.innerHTML = `
    <h1>FINAL: AUTOR SUPREMO</h1>
    <p>Você dominou a realidade.</p>
  `;
}

function perder() {
  som();
  document.body.innerHTML = `
    <h1>FINAL: CORROMPIDO</h1>
    <p>O vazio te consumiu.</p>
  `;
}

function morrer() {
  som();
  document.body.innerHTML = `
    <h1>FINAL: NADA</h1>
    <p>Você deixou de existir.</p>
  `;
}
</script>

</body>
</html>
