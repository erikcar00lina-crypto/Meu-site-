<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Miner</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; }
  canvas { display: block; }

  /* BOTÕES MOBILE */
  .btn {
    position: absolute;
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 20px;
    text-align: center;
    line-height: 60px;
    border-radius: 10px;
    user-select: none;
  }

  #left { bottom: 80px; left: 20px; }
  #right { bottom: 80px; left: 100px; }
  #jump { bottom: 80px; right: 20px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="left" class="btn">◀</div>
<div id="right" class="btn">▶</div>
<div id="jump" class="btn">⤴</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gravity = 0.5;
let gameOver = false;

// CONTROLE MOBILE
let mobile = { left:false, right:false, jump:false };

function bindBtn(id, key){
  let el = document.getElementById(id);
  el.ontouchstart = () => mobile[key] = true;
  el.ontouchend = () => mobile[key] = false;
}
bindBtn("left","left");
bindBtn("right","right");
bindBtn("jump","jump");

// CÂMERA
let camera = { x:0, y:0 };

// PLAYER
let player = {
  x: 200,
  y: 100,
  w: 30,
  h: 30,
  dx: 0,
  dy: 0,
  speed: 4,
  jumping: false,
  life: 100
};

// INVENTÁRIO
let inventory = {
  dirt: 0,
  stone: 0,
  gold: 0
};

// BOSS
let boss = { x:600, y:100, w:30, h:30, speed:1.5 };

// MUNDO
let blockSize = 40;
let blocks = [];

function generateWorld(){
  blocks = [];
  for (let x=0; x<100; x++){
    for (let y=10; y<25; y++){

      let type = "dirt";
      if (y > 15) type = "stone";
      if (y > 20 && Math.random() < 0.1) type = "gold";

      blocks.push({
        x:x*blockSize,
        y:y*blockSize,
        w:blockSize,
        h:blockSize,
        type:type,
        hp: type==="dirt"?1 : type==="stone"?3 : 5
      });
    }
  }
}
generateWorld();

// CONTROLES PC
let keys = {};
document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

// MINERAÇÃO COM TEMPO
canvas.addEventListener("mousedown", mine);
function mine(e){
  if (gameOver) return;

  let rect = canvas.getBoundingClientRect();
  let mx = e.clientX - rect.left + camera.x;
  let my = e.clientY - rect.top + camera.y;

  blocks.forEach((b,i)=>{
    if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h){

      b.hp--;

      if (b.hp <= 0){
        inventory[b.type]++;
        blocks.splice(i,1);
      }
    }
  });
}

// RESTART
function restartGame(){
  player.x=200; player.y=100; player.life=100;
  boss.x=600; boss.y=100;
  inventory = {dirt:0,stone:0,gold:0};
  gameOver=false;
  generateWorld();
}

// UPDATE
function update(){
  if (gameOver) return;

  let left = keys["a"] || mobile.left;
  let right = keys["d"] || mobile.right;
  let jump = keys["w"] || mobile.jump;

  if (left) player.dx = -player.speed;
  else if (right) player.dx = player.speed;
  else player.dx = 0;

  if (jump && !player.jumping){
    player.dy = -10;
    player.jumping = true;
  }

  player.dy += gravity;
  player.x += player.dx;
  player.y += player.dy;

  player.jumping = true;
  blocks.forEach(b=>{
    if (player.x < b.x+b.w &&
        player.x+player.w > b.x &&
        player.y < b.y+b.h &&
        player.y+player.h > b.y){

      player.y = b.y - player.h;
      player.dy = 0;
      player.jumping = false;
    }
  });

  // BOSS
  boss.x += (player.x > boss.x ? boss.speed : -boss.speed);
  boss.y += (player.y > boss.y ? boss.speed : -boss.speed);

  // DANO
  if (player.x < boss.x+boss.w &&
      player.x+player.w > boss.x &&
      player.y < boss.y+boss.h &&
      player.y+player.h > boss.y){
    player.life -= 0.5;
  }

  if (player.life <= 0) gameOver = true;

  // CÂMERA
  camera.x = player.x - canvas.width/2;
  camera.y = player.y - canvas.height/2;
}

// DRAW
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  blocks.forEach(b=>{
    if (b.type==="dirt") ctx.fillStyle="brown";
    if (b.type==="stone") ctx.fillStyle="gray";
    if (b.type==="gold") ctx.fillStyle="gold";
    ctx.fillRect(b.x,b.y,b.w,b.h);
  });

  ctx.fillStyle="blue";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="red";
  ctx.fillRect(boss.x,boss.y,boss.w,boss.h);

  ctx.restore();

  // HUD
  ctx.fillStyle="black";
  ctx.fillText("Vida: "+Math.floor(player.life),20,30);
  ctx.fillText("Terra: "+inventory.dirt,20,50);
  ctx.fillText("Pedra: "+inventory.stone,20,70);
  ctx.fillText("Ouro: "+inventory.gold,20,90);

  if (gameOver){
    ctx.font="40px Arial";
    ctx.fillText("GAME OVER", canvas.width/2-120, canvas.height/2);
    ctx.font="20px Arial";
    ctx.fillText("Pressione R", canvas.width/2-80, canvas.height/2+40);
  }
}

// RESET
document.addEventListener("keydown", e=>{
  if (e.key==="r" && gameOver) restartGame();
});

// LOOP
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
