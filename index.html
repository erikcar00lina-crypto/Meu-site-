<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner do Autor Absoluto</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: white;
  font-family: Arial;
  text-align: center;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 20px;
  left: 50%;
  width: 50px;
  height: 50px;
  background: purple;
  transform: translateX(-50%);
  border-radius: 10px;
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  top: 0;
  width: 50px;
  height: 50px;
  background: red;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}
</style>
</head>

<body>

<div id="hud">❤️ Vida: <span id="vida">3</span></div>

<div id="player"></div>

<script>
let player = document.getElementById("player");
let vida = 3;
let pos = window.innerWidth / 2;

document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft") pos -= 100;
  if(e.key === "ArrowRight") pos += 100;
  player.style.left = pos + "px";
});

/* CRIAR OBSTÁCULOS */
setInterval(() => {
  let o = document.createElement("div");
  o.className = "obstaculo";
  o.style.left = Math.random()*window.innerWidth + "px";
  document.body.appendChild(o);

  let fall = setInterval(() => {
    o.style.top = (o.offsetTop + 5) + "px";

    /* colisão */
    if(
      o.offsetTop > window.innerHeight - 80 &&
      Math.abs(o.offsetLeft - player.offsetLeft) < 50
    ){
      vida--;
      document.getElementById("vida").innerText = vida;
      o.remove();
      clearInterval(fall);

      if(vida <= 0){
        alert("💀 Você foi derrotado");
        location.reload();
      }
    }

    if(o.offsetTop > window.innerHeight){
      o.remove();
      clearInterval(fall);
    }

  }, 20);

}, 1000);

/* DOMÍNIO (tecla espaço) */
document.addEventListener("keydown", e => {
  if(e.code === "Space"){
    document.body.style.background = "purple";

    document.querySelectorAll(".obstaculo").forEach(o => o.remove());

    setTimeout(()=>{
      document.body.style.background = "black";
    },300);
  }
});
</script>

</body>
</html>
