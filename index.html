<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner 3 Pistas</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: white;
  text-align: center;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 40px;
  width: 50px;
  height: 50px;
  background: purple;
  border-radius: 10px;
  transition: left 0.2s;
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  top: 0;
  width: 50px;
  height: 50px;
  background: red;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}

/* BOTÕES */
#controles {
  position: fixed;
  bottom: 20px;
  width: 100%;
}

button {
  padding: 15px;
  margin: 10px;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="hud">❤️ Vida: <span id="vida">3</span></div>

<div id="player"></div>

<div id="controles">
  <button onclick="mover(-1)">⬅️</button>
  <button onclick="dominio()">⚡</button>
  <button onclick="mover(1)">➡️</button>
</div>

<script>
let lanes = [window.innerWidth*0.2, window.innerWidth*0.5, window.innerWidth*0.8];
let laneIndex = 1; // começa no meio
let player = document.getElementById("player");
let vida = 3;

function atualizarPos(){
  player.style.left = lanes[laneIndex] + "px";
}

atualizarPos();

function mover(dir){
  laneIndex += dir;
  if(laneIndex < 0) laneIndex = 0;
  if(laneIndex > 2) laneIndex = 2;
  atualizarPos();
}

/* OBSTÁCULOS */
setInterval(() => {
  let o = document.createElement("div");
  o.className = "obstaculo";

  let lane = Math.floor(Math.random()*3);
  o.dataset.lane = lane;
  o.style.left = lanes[lane] + "px";

  document.body.appendChild(o);

  let fall = setInterval(() => {
    o.style.top = (o.offsetTop + 6) + "px";

    if(
      o.offsetTop > window.innerHeight - 100 &&
      parseInt(o.dataset.lane) === laneIndex
    ){
      vida--;
      document.getElementById("vida").innerText = vida;
      o.remove();
      clearInterval(fall);

      if(vida <= 0){
        alert("💀 Game Over");
        location.reload();
      }
    }

    if(o.offsetTop > window.innerHeight){
      o.remove();
      clearInterval(fall);
    }

  }, 20);

}, 900);

/* DOMÍNIO */
function dominio(){
  document.body.style.background = "purple";

  document.querySelectorAll(".obstaculo").forEach(o => o.remove());

  setTimeout(()=>{
    document.body.style.background = "black";
  },300);
}
</script>

</body>
  </html>
