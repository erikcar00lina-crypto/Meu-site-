<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Miner Mobile</title>
<style>
  body { margin: 0; overflow: hidden; background: skyblue; }
  canvas { display: block; }

  .btn {
    position: absolute;
    width: 70px;
    height: 70px;
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 25px;
    text-align: center;
    line-height: 70px;
    border-radius: 12px;
    user-select: none;
  }

  #left { bottom: 80px; left: 20px; }
  #right { bottom: 80px; left: 110px; }
  #jump { bottom: 80px; right: 20px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="left" class="btn">◀</div>
<div id="right" class="btn">▶</div>
<div id="jump" class="btn">⤴</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let gravity = 0.5;

// CONTROLE MOBILE
let mobile = {left:false,right:false,jump:false};

function bind(id,key){
  let b=document.getElementById(id);
  b.ontouchstart=()=>mobile[key]=true;
  b.ontouchend=()=>mobile[key]=false;
}
bind("left","left");
bind("right","right");
bind("jump","jump");

// PLAYER
let player = {
  x: 200,
  y: 100,
  w: 30,
  h: 30,
  dx: 0,
  dy: 0,
  jumping: false
};

// CÂMERA
let camera = {x:0,y:0};

// MUNDO
let blocks = [];
let size = 40;

function generateWorld(){
  blocks = [];

  for(let x=0;x<80;x++){
    for(let y=12;y<25;y++){

      let type="dirt";

      if(y===12) type="grass";
      else if(y>18) type="stone";

      // água
      if(x>10 && x<15 && y===12) type="water";

      blocks.push({
        x:x*size,
        y:y*size,
        w:size,
        h:size,
        type:type
      });
    }

    // árvores
    if(Math.random()<0.1){
      let baseY = 11*size;
      blocks.push({x:x*size,y:baseY,w:size,h:size,type:"wood"});
      blocks.push({x:x*size,y:baseY-size,w:size,h:size,type:"leaf"});
    }
  }
}
generateWorld();

// MINERAR
canvas.addEventListener("touchstart", e=>{
  let t = e.touches[0];
  let mx = t.clientX + camera.x;
  let my = t.clientY + camera.y;

  blocks.forEach((b,i)=>{
    if(mx>b.x && mx<b.x+b.w && my>b.y && my<b.y+b.h){
      blocks.splice(i,1);
    }
  });
});

// UPDATE
function update(){

  if(mobile.left) player.dx=-4;
  else if(mobile.right) player.dx=4;
  else player.dx=0;

  if(mobile.jump && !player.jumping){
    player.dy=-10;
    player.jumping=true;
  }

  player.dy+=gravity;
  player.x+=player.dx;
  player.y+=player.dy;

  // COLISÃO
  player.jumping=true;
  blocks.forEach(b=>{
    if(player.x < b.x+b.w &&
       player.x+player.w > b.x &&
       player.y < b.y+b.h &&
       player.y+player.h > b.y){

      if(b.type!=="water"){
        player.y=b.y-player.h;
        player.dy=0;
        player.jumping=false;
      }
    }
  });

  // CAIU DEMAIS → TELEPORTA
  if(player.y > 1200){
    player.y = 0;
  }

  // CÂMERA
  camera.x = player.x - canvas.width/2;
  camera.y = player.y - canvas.height/2;
}

// DRAW
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // SOL
  ctx.fillStyle="yellow";
  ctx.beginPath();
  ctx.arc(100,100,40,0,Math.PI*2);
  ctx.fill();

  // NUVENS
  ctx.fillStyle="white";
  ctx.fillRect(200,80,80,40);
  ctx.fillRect(400,60,100,50);

  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  blocks.forEach(b=>{
    if(b.type==="dirt") ctx.fillStyle="brown";
    if(b.type==="grass") ctx.fillStyle="green";
    if(b.type==="stone") ctx.fillStyle="gray";
    if(b.type==="water") ctx.fillStyle="blue";
    if(b.type==="wood") ctx.fillStyle="#8B4513";
    if(b.type==="leaf") ctx.fillStyle="lime";

    ctx.fillRect(b.x,b.y,b.w,b.h);
  });

  ctx.fillStyle="blue";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.restore();
}

// LOOP
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
