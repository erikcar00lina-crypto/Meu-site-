<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Miner</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; }
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gravity = 0.5;

// PLAYER
let player = {
  x: 100,
  y: 100,
  w: 30,
  h: 30,
  dx: 0,
  dy: 0,
  speed: 4,
  jumping: false
};

// BOSS (segue o player)
let boss = {
  x: 300,
  y: 100,
  w: 30,
  h: 30,
  speed: 1.5
};

// BLOCOS (mundo em grid)
let blockSize = 40;
let blocks = [];

for (let x = 0; x < 20; x++) {
  for (let y = 10; y < 15; y++) {
    blocks.push({
      x: x * blockSize,
      y: y * blockSize,
      w: blockSize,
      h: blockSize
    });
  }
}

// CONTROLES
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// QUEBRAR BLOCOS (clique)
canvas.addEventListener("click", function(e) {
  let rect = canvas.getBoundingClientRect();
  let mouseX = e.clientX - rect.left;
  let mouseY = e.clientY - rect.top;

  for (let i = 0; i < blocks.length; i++) {
    let b = blocks[i];

    if (mouseX >= b.x && mouseX <= b.x + b.w &&
        mouseY >= b.y && mouseY <= b.y + b.h) {
      
      blocks.splice(i, 1); // remove bloco
      break;
    }
  }
});

// UPDATE
function update() {
  // Movimento
  if (keys["a"]) player.dx = -player.speed;
  else if (keys["d"]) player.dx = player.speed;
  else player.dx = 0;

  if (keys["w"] && !player.jumping) {
    player.dy = -10;
    player.jumping = true;
  }

  // Gravidade
  player.dy += gravity;

  player.x += player.dx;
  player.y += player.dy;

  // Colisão com blocos
  player.jumping = true;
  blocks.forEach(b => {
    if (player.x < b.x + b.w &&
        player.x + player.w > b.x &&
        player.y < b.y + b.h &&
        player.y + player.h > b.y) {

      player.y = b.y - player.h;
      player.dy = 0;
      player.jumping = false;
    }
  });

  // Boss segue player
  if (boss.x < player.x) boss.x += boss.speed;
  else boss.x -= boss.speed;

  if (boss.y < player.y) boss.y += boss.speed;
  else boss.y -= boss.speed;
}

// DRAW
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Player
  ctx.fillStyle = "blue";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Boss
  ctx.fillStyle = "red";
  ctx.fillRect(boss.x, boss.y, boss.w, boss.h);

  // Blocos
  ctx.fillStyle = "brown";
  blocks.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });
}

// LOOP
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
