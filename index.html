<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Reino do Autor Absoluto</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #000, #050010);
  color: white;
  font-family: Arial;
  text-align: center;
  overflow: hidden;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}

.bar {
  width: 80%;
  height: 20px;
  background: #222;
  margin: 5px auto;
  border-radius: 10px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: linear-gradient(to right, purple, cyan);
}

/* BOTÕES */
button {
  margin: 10px;
  padding: 12px 20px;
  background: purple;
  border: none;
  color: white;
  cursor: pointer;
}
button:hover {
  background: cyan;
  color: black;
}

/* ANIMAÇÕES */
@keyframes shake {
  0% { transform: translate(0px); }
  25% { transform: translate(5px,-5px); }
  50% { transform: translate(-5px,5px); }
  75% { transform: translate(5px,5px); }
}

@keyframes flash {
  from { background: white; }
  to { background: black; }
}

#aura {
  position: fixed;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, purple, transparent);
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  from { opacity: 0.3; transform: scale(1); }
  to { opacity: 0.8; transform: scale(1.5); }
}
</style>
</head>

<body>

<div id="hud">
  <div>❤️ Você</div>
  <div class="bar"><div id="hpPlayer" class="fill" style="width:100%"></div></div>
  <div>💀 Inimigo</div>
  <div class="bar"><div id="hpEnemy" class="fill" style="width:100%"></div></div>
</div>

<h1>絶対的作者の王国</h1>
<p>Uma presença surge diante de você...</p>

<button onclick="iniciar()">Iniciar Batalha</button>

<div id="aura" style="display:none;"></div>

<audio id="bgm" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<audio id="hit">
  <source src="https://www.soundjay.com/buttons/sounds/button-10.mp3">
</audio>

<script>
let playerHP = 100;
let enemyHP = 100;

function atualizarHUD() {
  document.getElementById("hpPlayer").style.width = playerHP + "%";
  document.getElementById("hpEnemy").style.width = enemyHP + "%";
}

function som(id) {
  document.getElementById(id).play();
}

function iniciar() {
  document.getElementById("bgm").play();
  document.getElementById("aura").style.display = "block";

  document.body.innerHTML += `
    <p>O inimigo ativa um domínio...</p>
    <button onclick="ataque()">Atacar</button>
    <button onclick="dominio()">Expandir Domínio</button>
  `;
}

function ataque() {
  som("hit");
  let dano = Math.floor(Math.random() * 15) + 5;
  enemyHP -= dano;

  contraAtaque();
  animacao();

  verificar();
}

function dominio() {
  som("hit");
  document.body.style.animation = "shake 0.3s";
  let dano = Math.floor(Math.random() * 30) + 20;
  enemyHP -= dano;

  contraAtaque(true);
  animacao();

  verificar();
}

function contraAtaque(forte=false) {
  let dano = forte ? 15 : 8;
  playerHP -= dano;
}

function animacao() {
  document.body.style.animation = "shake 0.3s";
  setTimeout(() => {
    document.body.style.animation = "none";
  }, 300);
  atualizarHUD();
}

function verificar() {
  if (enemyHP <= 0) {
    fim("🔥 FINAL: AUTOR SUPREMO — Você venceu");
  }
  if (playerHP <= 0) {
    fim("💀 FINAL: APAGADO — Você perdeu");
  }
}

function fim(msg) {
  document.body.innerHTML = `<h1>${msg}</h1>`;
}
</script>

</body>
</html>
