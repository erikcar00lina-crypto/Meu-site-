<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner 3D Fake</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* PISTA */
#road {
  position: absolute;
  width: 100%;
  height: 100%;
  perspective: 500px;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 80px;
  left: 50%;
  width: 40px;
  height: 60px;
  background: purple;
  transform: translateX(-50%);
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  width: 40px;
  height: 40px;
  background: red;
  transform-origin: center;
}
</style>
</head>

<body>

<div id="road"></div>
<div id="player"></div>

<script>
let road = document.getElementById("road");
let player = document.getElementById("player");

let lanes = [-100, 0, 100];
let lane = 1;

/* mover */
document.addEventListener("click", e => {
  if(e.clientX < window.innerWidth/2) lane--;
  else lane++;

  if(lane < 0) lane = 0;
  if(lane > 2) lane = 2;

  player.style.left = (window.innerWidth/2 + lanes[lane]) + "px";
});

/* criar obstáculos */
setInterval(()=>{
  let o = document.createElement("div");
  o.className = "obstaculo";

  let l = Math.floor(Math.random()*3);
  o.dataset.lane = l;

  let z = 0;
  road.appendChild(o);

  let move = setInterval(()=>{
    z += 5;

    let scale = z/100;

    o.style.left = (window.innerWidth/2 + lanes[l]) + "px";
    o.style.top = (z*2) + "px";
    o.style.transform = "scale(" + scale + ")";

    /* colisão */
    if(z > 80 && l === lane){
      alert("💀 Game Over");
      location.reload();
    }

    if(z > 150){
      o.remove();
      clearInterval(move);
    }

  }, 30);

}, 1000);

/* DOMÍNIO */
document.addEventListener("keydown", e=>{
  if(e.code==="Space"){
    document.body.style.background="purple";
    document.querySelectorAll(".obstaculo").forEach(o=>o.remove());
    setTimeout(()=>document.body.style.background="black",300);
  }
});
</script>

</body>
</html>
