<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner 3 Pistas</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: white;
  text-align: center;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 80px;
  width: 50px;
  height: 60px;
  background: purple;
  border-radius: 10px;
  transition: left 0.2s;
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  width: 50px;
  height: 50px;
  background: red;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}

/* CONTROLES */
#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
}

button {
  padding: 15px;
  margin: 10px;
  font-size: 20px;
}
</style>
</head>

<body>

<div id="hud">❤️ Vida: <span id="vida">3</span></div>

<div id="player"></div>

<div id="controls">
  <button onclick="moveLeft()">⬅️</button>
  <button onclick="dominio()">⚡</button>
  <button onclick="moveRight()">➡️</button>
</div>

<script>
let player = document.getElementById("player");
let vida = 3;

/* pistas fixas */
let lanes = [window.innerWidth*0.2, window.innerWidth*0.5, window.innerWidth*0.8];
let laneIndex = 1;

function updatePlayer() {
  player.style.left = lanes[laneIndex] + "px";
}

updatePlayer();

function moveLeft() {
  if(laneIndex > 0) laneIndex--;
  updatePlayer();
}

function moveRight() {
  if(laneIndex < 2) laneIndex++;
  updatePlayer();
}

/* OBSTÁCULOS */
setInterval(() => {
  let o = document.createElement("div");
  o.className = "obstaculo";

  let lane = Math.floor(Math.random()*3);
  o.dataset.lane = lane;
  o.style.left = lanes[lane] + "px";
  o.style.top = "0px";

  document.body.appendChild(o);

  let fall = setInterval(() => {
    let top = parseInt(o.style.top);
    o.style.top = (top + 5) + "px";

    /* colisão */
    if(top > window.innerHeight - 140 && lane === laneIndex){
      vida--;
      document.getElementById("vida").innerText = vida;
      o.remove();
      clearInterval(fall);

      if(vida <= 0){
        alert("💀 Game Over");
        location.reload();
      }
    }

    if(top > window.innerHeight){
      o.remove();
      clearInterval(fall);
    }

  }, 30);

}, 1200);

/* DOMÍNIO */
function dominio(){
  document.body.style.background = "purple";
  document.querySelectorAll(".obstaculo").forEach(o => o.remove());

  setTimeout(()=>{
    document.body.style.background = "black";
  },300);
}
</script>

</body>
</html>
