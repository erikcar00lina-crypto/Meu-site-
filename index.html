<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Runner Lendário com Boss</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: white;
  text-align: center;
  font-family: Arial;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 80px;
  width: 50px;
  height: 60px;
  border-radius: 10px;
  transition: left 0.2s;
}

/* BOSS */
#boss {
  position: absolute;
  bottom: 80px;
  width: 50px;
  height: 60px;
  background: red;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0.7;
}

/* OBSTÁCULOS */
.obstaculo {
  position: absolute;
  width: 50px;
  height: 50px;
  background: red;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}

/* CONTROLES */
#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
}

button {
  padding: 20px;
  margin: 10px;
  font-size: 24px;
  border-radius: 10px;
}

/* GAME OVER */
#gameover {
  display:none;
  position:fixed;
  top:30%;
  width:100%;
}
</style>
</head>

<body>

<div id="hud">
❤️ <span id="vida">3</span> |
🏆 <span id="score">99999</span>
</div>

<div id="player"></div>
<div id="boss"></div>

<div id="controls">
<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>
</div>

<div id="gameover">
<h1>💀 Game Over</h1>
<p>Pontos: <span id="finalScore"></span></p>
<button onclick="location.reload()">Reiniciar</button>
</div>

<script>
let player = document.getElementById("player");
let boss = document.getElementById("boss");

let vida = 3;
let score = 0;
let gameRunning = true;

/* pistas */
let lanes = [window.innerWidth*0.2, window.innerWidth*0.5, window.innerWidth*0.8];
let laneIndex = 1;

function updatePlayer(){
  player.style.left = lanes[laneIndex] + "px";
}
updatePlayer();

/* boss posição */
let bossOffset = -150; // começa atrás

function updateBoss(){
  boss.style.left = lanes[laneIndex] + "px";
  boss.style.bottom = (80 + bossOffset) + "px";
}

setInterval(()=>{
  if(!gameRunning) return;

  bossOffset += 0.5; // boss vai chegando
  updateBoss();

  if(bossOffset >= 0){
    gameOver();
  }

}, 100);

/* movimento */
function moveLeft(){ if(!gameRunning) return; if(laneIndex>0) laneIndex--; updatePlayer(); }
function moveRight(){ if(!gameRunning) return; if(laneIndex<2) laneIndex++; updatePlayer(); }

/* score */
setInterval(()=>{
  if(!gameRunning) return;
  score++;
  document.getElementById("score").innerText = score;
},1000);

/* obstáculos */
setInterval(()=>{
  if(!gameRunning) return;

  let o = document.createElement("div");
  o.className = "obstaculo";

  let lane = Math.floor(Math.random()*3);
  o.dataset.lane = lane;
  o.style.left = lanes[lane] + "px";
  o.style.top = "0px";

  document.body.appendChild(o);

  let fall = setInterval(()=>{
    if(!gameRunning){
      o.remove();
      clearInterval(fall);
      return;
    }

    let top = parseInt(o.style.top);
    o.style.top = (top + 7) + "px";

    if(top > window.innerHeight - 140 && lane === laneIndex){
      vida--;
      document.getElementById("vida").innerText = vida;

      bossOffset += 20; // punição: boss aproxima

      o.remove();
      clearInterval(fall);

      if(vida <= 0) gameOver();
    }

    if(top > window.innerHeight){
      o.remove();
      clearInterval(fall);
    }

  },25);

},1000);

/* game over */
function gameOver(){
  gameRunning = false;
  document.getElementById("controls").style.display = "none";
  document.getElementById("gameover").style.display="block";
  document.getElementById("finalScore").innerText=score;
}
</script>

</body>
</html>
