<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Modo Lendário</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #000, #020012);
  color: white;
  font-family: Arial;
  text-align: center;
  overflow: hidden;
}

/* HUD */
#hud {
  position: fixed;
  top: 10px;
  width: 100%;
}

.bar {
  width: 80%;
  height: 18px;
  background: #222;
  margin: 5px auto;
  border-radius: 10px;
  overflow: hidden;
}

.hp { background: linear-gradient(to right, red, orange); }
.mana { background: linear-gradient(to right, purple, cyan); }

.fill {
  height: 100%;
  width: 100%;
}

/* BOTÕES */
button {
  margin: 8px;
  padding: 12px 18px;
  background: purple;
  border: none;
  color: white;
  cursor: pointer;
}
button:disabled {
  opacity: 0.4;
}
button:hover {
  background: cyan;
  color: black;
}

/* ANIMAÇÕES */
@keyframes shake {
  0% { transform: translate(0px); }
  25% { transform: translate(5px,-5px); }
  50% { transform: translate(-5px,5px); }
  75% { transform: translate(5px,5px); }
}

#aura {
  position: fixed;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, purple, transparent);
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  from { opacity: 0.3; transform: scale(1); }
  to { opacity: 0.9; transform: scale(1.6); }
}

/* partículas */
.particle {
  position: fixed;
  width: 5px;
  height: 5px;
  background: cyan;
  border-radius: 50%;
  animation: float 2s linear forwards;
}

@keyframes float {
  to {
    transform: translateY(-200px);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="hud">
  ❤️ Player
  <div class="bar"><div id="hpP" class="fill hp"></div></div>

  ⚡ Energia
  <div class="bar"><div id="manaP" class="fill mana"></div></div>

  💀 Inimigo
  <div class="bar"><div id="hpE" class="fill hp"></div></div>
</div>

<h1>絶対的作者の王国</h1>
<p>Batalha Lendária iniciada...</p>

<button onclick="start()">Começar</button>

<div id="aura" style="display:none;"></div>

<audio id="bgm" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
</audio>

<script>
let hpP=100, hpE=100, mana=100;
let cdDominio=false;

function update(){
  document.getElementById("hpP").style.width = hpP+"%";
  document.getElementById("hpE").style.width = hpE+"%";
  document.getElementById("manaP").style.width = mana+"%";
}

function start(){
  document.getElementById("bgm").play();
  document.getElementById("aura").style.display="block";

  document.body.innerHTML += `
  <div>
    <button id="atk" onclick="atk()">Ataque</button>
    <button id="dom" onclick="dom()">Domínio</button>
    <button onclick="charge()">Carregar Energia</button>
  </div>`;
}

function atk(){
  let dmg = Math.random()*10+5;
  hpE -= dmg;
  mana += 5;
  efeito();
  enemyAI();
}

function dom(){
  if(mana<40 || cdDominio) return;

  mana -= 40;
  cdDominio=true;

  let dmg = Math.random()*40+20;
  hpE -= dmg;

  screenShake();
  spawnParticles(30);

  setTimeout(()=> cdDominio=false,3000);

  enemyAI(true);
}

function charge(){
  mana += 15;
  enemyAI();
}

function enemyAI(forte=false){
  let choice = Math.random();

  if(forte){
    hpP -= 20;
  } else if(choice<0.5){
    hpP -= 10;
  } else {
    hpP -= 5;
    hpE += 5; // inimigo se cura
  }

  efeito();
  check();
}

function efeito(){
  screenShake();
  update();
}

function screenShake(){
  document.body.style.animation="shake 0.3s";
  setTimeout(()=>document.body.style.animation="none",300);
}

function spawnParticles(n){
  for(let i=0;i<n;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.top="80%";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
}

function check(){
  if(hpE<=0){
    end("🔥 FINAL LENDÁRIO: VOCÊ REESCREVEU A REALIDADE");
  }
  if(hpP<=0){
    end("💀 FINAL: VOCÊ FOI APAGADO");
  }
}

function end(msg){
  document.body.innerHTML = `<h1>${msg}</h1>`;
}
</script>

</body>
</html>
